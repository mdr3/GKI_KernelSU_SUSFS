name: 'Configure Kernel Options'
description: 'Set up kernel configuration fragment with required options'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Configuration
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/wild_gki.fragment" << 'EOF'
        # Optional kernel config placeholders
        # Networking Configuration
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y

        # BBR TCP Congestion Control
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        # CONFIG_TCP_CONG_BIC is not set
        # CONFIG_TCP_CONG_WESTWOOD is not set
        # CONFIG_TCP_CONG_HTCP is not set

        # IPSet Support
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPMARK=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_IPMAC=y
        CONFIG_IP_SET_HASH_MAC=y
        CONFIG_IP_SET_HASH_NETPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_IP_SET_LIST_SET=y

        # bpf 
        CONFIG_DEBUG_INFO_REDUCED=n           # Can interfere with full BTF generation
        CONFIG_DEBUG_INFO_COMPRESSED=n        # Avoid if using pahole/BTF
        CONFIG_RANDOMIZE_BASE=n               # Or be careful — KASLR changes offsets, CO-RE handles it but can complicate debugging
        CONFIG_GCC_PLUGINS=n                  # Sometimes breaks pahole/BTF gen on Android builds
        CONFIG_MODVERSIONS=n                  # Module versioning can conflict with some eBPF tools on GKI
        CONFIG_TRIM_UNUSED_KSYMS=n            # Don't aggressively trim symbols — some eBPF needs them
        CONFIG_KERNEL_LTO_NONE=y              # Or thin LTO; full LTO sometimes breaks pahole/BTF on older clang
        CONFIG_BPF_KPROBE_OVERRIDE=y          # Override return values from kprobes (powerful but dangerous)
        CONFIG_BPF_UNPRIV_DEFAULT_OFF=y       # Unprivileged BPF disabled by default (safer on Android)
        CONFIG_PROFILING=y                    # perf_events / sampling support
        CONFIG_PERF_EVENTS=y
        CONFIG_STACKTRACE=y                   # For stack traces in eBPF (bpf_get_stack)
        CONFIG_STACKTRACE_SUPPORT=y
        CONFIG_DYNAMIC_FTRACE_WITH_REGS=y     # Better ftrace regs for more helpers
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y                  # BPF syscall → allows loading programs from userspace
        CONFIG_BPF_JIT=y
        CONFIG_HAVE_EBPF_JIT=y
        CONFIG_BPF_JIT_ALWAYS_ON=y            # Most modern kernels force this anyway
        CONFIG_DEBUG_INFO_BTF=y               # Core for CO-RE: detached/embedded BTF → pahole extracts it
        CONFIG_DEBUG_INFO_BTF_MODULES=y       # Split BTF for modules (very useful on GKI)
        CONFIG_IKHEADERS=y                    # /sys/kernel/btf/vmlinux → some tools still look here
        CONFIG_BPF_EVENTS=y                   # Enables tracepoints, kprobes/uprobes in eBPF
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y                # kprobe-based eBPF programs
        CONFIG_UPROBES=y                      # If you need user-space probing
        CONFIG_TRACEPOINTS=y                  # Tracepoint attachment (very common in Android eBPF)
        CONFIG_FTRACE=y                       # Foundation for function tracing
        CONFIG_FUNCTION_TRACER=y
        CONFIG_HAVE_DYNAMIC_FTRACE=y
        CONFIG_DYNAMIC_FTRACE=y
        CONFIG_FTRACE_SYSCALLS=y              # Syscall tracepoints (critical for many tools)
        CONFIG_BPF_LSM=y                      # LSM BPF programs (optional but increasingly used)
        CONFIG_CGROUP_BPF=y                   # cgroup-aware BPF (sockets, devices, etc.)
        CONFIG_NET_CLS_BPF=y                  # TC classifier BPF
        CONFIG_NET_ACT_BPF=y                  # TC actions BPF
        CONFIG_NETFILTER_XT_MATCH_BPF=y       # iptables/nftables BPF match (if using netfilter)
        CONFIG_BPF_STREAM_PARSER=y            # sockmap/stream parser BPF
        EOF

    - name: Apply Kernel Config for 5.10
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      if: inputs.kernel_version == '5.10'
      run: |
        sed -i 's/CONFIG_IP_SET_MAX/65534/g' net/netfilter/ipset/ip_set_core.c
